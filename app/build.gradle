plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simpletablet.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.simpletablet.launcher'
        minSdk 29          // Android 10+. Optimized for Android 15 tablet launcher.
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Minimal standard dependencies for offline WebView launcher
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
